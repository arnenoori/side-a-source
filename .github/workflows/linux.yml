name: Linux checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Build and test (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container:
      image: swift:6.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The protocol package and its fixture suite, SideACore and its tests, and the sidead spike: the same script as
      # `scripts/linux-check.sh` run from a Mac in Docker.
      - name: Build and test
        run: scripts/linux-check.sh --here
